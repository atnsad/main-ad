<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه نمایش</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: sans-serif;
            box-sizing: border-box;
        }

        .main-wrapper {
            padding: 24px;
        }

        /* بخش نگه‌دارنده بنرها در انتهای صفحه بدون استفاده از fixed یا sticky */
        .bottom-sponsors-section {
            width: 100%;
            padding: 20px 0;
            background-color: #f9f9f9;
            border-top: 1px solid #e5e5e5;
        }

        .sponsor-grid-layout {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .sponsor-slot-item {
            flex: 0 1 auto;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>

    <!-- اسکریپت اصلی یکتانت (بدون دستکاری کد) -->
    <script>
        !function(e,t,n){
            e.yektanetAnalyticsObject=n,
            e[n]=e[n]||function(){e[n].q.push(arguments)},
            e[n].q=e[n].q||[];
            var a=t.getElementsByTagName("head")[0],
                r=new Date,
                c="https://cdn.yektanet.com/superscript-v2/4jtZkMmw/native-48755/yn_pub.js?v="
                    +r.getFullYear().toString()+"0"+r.getMonth()+"0"+r.getDate()+"0"+r.getHours(),
                s=t.createElement("link");
            s.rel="preload",
            s.as="script",
            s.href=c,
            a.appendChild(s);
            var l=t.createElement("script");
            l.async=!0,
            l.src=c,
            a.appendChild(l);
        }(window,document,"yektanet");
    </script>
</head>
<body>

    <main class="main-wrapper">
        <p></p>
    </main>

    <!-- کانتینر پایین صفحه؛ عاری از واژه‌های حساس AdBlock مثل ads و banner -->
    <footer class="bottom-sponsors-section">
        <div class="sponsor-grid-layout">
            <div class="sponsor-slot-item">
                <!-- جایگاه بنری اول -->
                <div class="yn-bnr" id="ynpos-20953"></div>
            </div>
            <div class="sponsor-slot-item">
                <!-- جایگاه بنری دوم (شناسه جایگاه اختصاصی پنل را جایگزین کنید) -->
                <div class="yn-bnr" id="ynpos-20954"></div>
            </div>
        </div>
    </footer>

</body>
</html>
